name: 'redshift_cost_opt_sandbox'
version: '0.1.0'
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

require-dbt-version: [">=1.7.0"]

# Local-build defaults. The project layers itself materializes as documented:
#   staging       -> view
#   intermediate  -> view (with one exception for chain-depth fixture)
#   marts         -> explicit per-model config (table or incremental)
models:
  redshift_cost_opt_sandbox:
    +bind: false
    staging:
      +schema: stg
    intermediate:
      +schema: int
    marts:
      +schema: marts

vars:
  # Tighten/loosen these in the cost-optimization package when running against
  # this project. They're surfaced here for visibility, not consumed locally.
  materialization_lookback_days: 7
  incremental_lookback_days: 14
  incremental_candidates_min_build_time_sec: 5        # was 300
  incremental_candidates_min_size_gb: 1                # was 2 (fct_lineitem clears this either way)
  incremental_candidates_min_compute_waste_score: 0.05 # was 5
  incremental_candidates_min_compute_waste_avg_build_sec: 1  # was 30
flags:
  require_generic_test_arguments_property: true