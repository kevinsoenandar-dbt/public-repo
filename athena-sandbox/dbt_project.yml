name: 'athena_sandbox'
version: '1.0.0'
profile: 'athena_sandbox'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  athena_sandbox:
    +on_schema_change: append_new_columns
    example:
      +materialized: view
    test:
      +materialized: table
      +table_type: iceberg
      +format: parquet
      +contract:
        enforced: true

seeds:
  athena_sandbox:
    +database: "{{ target.database }}"
    example:
      +enabled: true
